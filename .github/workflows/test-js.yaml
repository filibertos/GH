name: Test js workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nodex-action:
    name: Test nodex-action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci
        working-directory: get-node-hithub-data-action

      - name: Test nodex action
        id: test-nodex-action
        uses: ./get-node-github-data-action
        with:
          github-username: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nodex action result
        run: echo "${{ steps.testx-node-action.outputs.email }}"
