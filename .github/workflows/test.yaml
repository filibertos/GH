name: Test workflow

on:
  workflow_dispatch:

jobs:

  test-dummy:
    name: Test dummy
    runs-on: ubuntu-latest

    steps:
      - name: Call bash script 1
        env:
          VAR_UNO: ${{ vars.VAR_UNO }}
        run: echo "* $VAR_UNO"

      - name: Call bash script 2
        env:
          VAR_DUE: ${{ vars.VAR_DUE }}
        run: echo "* $VAR_DUE"

      - name: Workflow commans
        run: |
          echo "::group::filiberto"
          echo "ok, talking about him"
          echo "::endgroup::"
          echo "::group::tanja"
          echo "ok, talking about her"
          echo "::endgroup::"

  test-node-action:
    name: Test node action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: add-node-action

      - name: Test node action
        id: test-node-action
        uses: ./add-node-action
        with:
          argument-a: "12"
          argument-b: "13"

      - name: Node action result
        run: echo "${{ steps.test-node-action.outputs.result }}"

  test-docker-action:
    name: Test docker action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test docker action
        id: test-docker-action
        uses: ./add-docker-action
        with:
          argument-a: "12"
          argument-b: "13"

  test-nodex-action:
    name: Test nodex action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test nodex action
        id: test-nodex-action
        uses: ./get-node-github-data-action
        with:
          github-username: "filibertos"
          github-token: "$GITHUB_TOKEN"

      - name: Nodex action result
        run: echo "${{ steps.testx-node-action.outputs.email }}"
