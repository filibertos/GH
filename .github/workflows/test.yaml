name: Test workflow

on:
  workflow_dispatch:

jobs:

  test-dummy:
    name: Test dummy
    runs-on: ubuntu-latest

    steps:

      - name: Call bash script 1
        env:
          VAR_UNO: ${{ vars.VAR_UNO }}
        run: echo "* $VAR_UNO"

      - name: Call bash script 2
        env:
          VAR_DUE: ${{ vars.VAR_DUE }}
        run: echo "* $VAR_DUE"

  test-node-action:
    name: Test node action
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        working-directory: add-node-action

      - name: Test node action
        id: test-node-action
        uses: ./add-node-action
        with:
          argument-a: "12"
          argument-b: "13"

      - name: Node action result
        run: echo "${{ steps.test-node-action.outputs.result }}"
